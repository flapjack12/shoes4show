{% extends 'shoes4show/base.html' %}

{% block title_block %}
Login
{% endblock %}

{% block body_block %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">
            <div class="bg-white p-4 border rounded">
                <h1 class="text-center mb-4" style="text-decoration: underline;">Login</h1>

                {% if error_message %}
                    <div class="alert alert-danger" role="alert">
                        {{ error_message }}
                    </div>
                {% endif %}

                <form method="post" action="{% url 'shoes4show:login' %}">
                    {% csrf_token %}

                    <input type="hidden" name="next" value="{{ request.GET.next }}">

                    <div class="form-group">
                        <label for="id_username">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="id_password">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-dark btn-block mt-3">Login</button>
                </form>

                <p class="text-center mt-4 mb-0">
                    Don’t have an account?
                    <a href="{% url 'shoes4show:register' %}">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
